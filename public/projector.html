<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAIL Battle Map - Projector View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #070b19; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; }
    
    #projector-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Initial Loading / Empty State Overlay */
    #empty-state-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 2rem 3rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
    }
    #empty-state-banner h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    #empty-state-banner p { font-size: 1rem; color: #94a3b8; }

    /* Cinematic Banner Overlay */
    .cinematic-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 25, 0.92);
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .cinematic-overlay.active { opacity: 1; pointer-events: auto; }
    .cinematic-title {
      font-size: 3.5rem;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      text-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
      margin-bottom: 1rem;
    }
    .cinematic-subtitle {
      font-size: 1.5rem;
      color: #94a3b8;
      font-style: italic;
    }

    /* Live Roll Broadcast Card */
    #roll-broadcast-hud {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 800;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: none;
      backdrop-filter: blur(8px);
    }
    #roll-broadcast-hud.active { display: block; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .roll-actor { font-size: 1.1rem; font-weight: 700; color: #38bdf8; margin-bottom: 0.25rem; }
    .roll-expr { font-size: 0.9rem; color: #94a3b8; }
    .roll-total-box { font-size: 2rem; font-weight: 900; color: #f8fafc; text-align: right; }
    .roll-total-box.crit { color: #4ade80; text-shadow: 0 0 12px #22c55e; }
    .roll-total-box.fail { color: #f87171; text-shadow: 0 0 12px #ef4444; }
  </style>

  <!-- PixiJS 8 WebGL Render Engine -->
  <script src="https://pixijs.download/v8.0.0/pixi.min.js"></script>

  <!-- Realtime Sockets & GRAIL Modules -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/dice_parser.js"></script>
  <script src="/js/lighting_fog.js"></script>
  <script src="/js/scene_engine.js"></script>
</head>
<body>

  <div id="projector-container"></div>

  <!-- Welcome / Empty State Banner -->
  <div id="empty-state-banner">
    <h2 id="banner-title">⚔️ GRAIL BATTLE MAP</h2>
    <p id="banner-sub">Waiting for DM map load...</p>
  </div>

  <!-- Cinematic Overlay -->
  <div id="cinematic-overlay" class="cinematic-overlay">
    <h1 id="cinematic-title" class="cinematic-title">LOCATION DISCOVERED</h1>
    <p id="cinematic-subtitle" class="cinematic-subtitle">The Whispering Caverns</p>
  </div>

  <!-- Roll HUD -->
  <div id="roll-broadcast-hud">
    <div class="roll-actor" id="hud-actor">Character Name</div>
    <div class="roll-expr" id="hud-expr">Attack: 1d20 + 5</div>
    <div class="roll-total-box" id="hud-total">22</div>
  </div>

  <script>
    const socket = io();

    // Initialize PixiJS Battle Map Engine
    const container = document.getElementById('projector-container');
    
    function loadActiveScene() {
      fetch('/api/scene')
        .then(res => res.json())
        .then(scene => {
          if (scene && scene.id) {
            GrailSceneEngine.loadScene(scene);
            updateBanner(scene);
          }
        })
        .catch(err => console.warn('Could not fetch /api/scene:', err));
    }

    function updateBanner(scene) {
      const banner = document.getElementById('empty-state-banner');
      if (scene && (scene.background_url || (scene.tokens && scene.tokens.length > 0))) {
        banner.style.display = 'none';
      } else {
        banner.style.display = 'block';
        document.getElementById('banner-title').innerText = scene.name || '⚔️ GRAIL BATTLE MAP';
        document.getElementById('banner-sub').innerText = 'Use DM Console to upload a map image';
      }
    }

    GrailSceneEngine.init(container, false, socket).then(() => {
      loadActiveScene();
    });

    socket.on('connect', () => {
      socket.emit('scene:get');
    });

    // Listen for scene load / updates
    socket.on('scene:data', (scene) => {
      GrailSceneEngine.loadScene(scene);
      updateBanner(scene);
    });

    socket.on('scene:update', (scene) => {
      GrailSceneEngine.loadScene(scene);
      updateBanner(scene);
    });

    // Handle Dice Roll Broadcast
    socket.on('dice:broadcast', (rollData) => {
      const hud = document.getElementById('roll-broadcast-hud');
      const actorEl = document.getElementById('hud-actor');
      const exprEl = document.getElementById('hud-expr');
      const totalEl = document.getElementById('hud-total');

      actorEl.innerText = rollData.actorName || 'Player';
      exprEl.innerText = rollData.breakdownText || rollData.expression;
      totalEl.innerText = rollData.total;

      totalEl.className = 'roll-total-box';
      if (rollData.isNat20) totalEl.classList.add('crit');
      if (rollData.isNat1) totalEl.classList.add('fail');

      hud.classList.add('active');

      if (window.DiceParser) {
        DiceParser.show2DDiceAnimation(document.body, rollData, () => {
          setTimeout(() => hud.classList.remove('active'), 4000);
        });
      } else {
        setTimeout(() => hud.classList.remove('active'), 4000);
      }
    });

    // Cinematic Title Card Trigger
    socket.on('overlay:cinematic', (data) => {
      const overlay = document.getElementById('cinematic-overlay');
      const title = document.getElementById('cinematic-title');
      const subtitle = document.getElementById('cinematic-subtitle');

      title.innerText = data.title || 'CHAPTER I';
      subtitle.innerText = data.subtitle || '';
      overlay.classList.add('active');

      setTimeout(() => overlay.classList.remove('active'), data.durationMs || 5000);
    });
  </script>
</body>
</html>
